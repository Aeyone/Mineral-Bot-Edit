plugins {
    id "com.gradleup.shadow" version "9.3.1"
    id("java")
}

repositories {
    flatDir {
        dirs 'libs'
    }
    maven {
        url 'https://libraries.minecraft.net/'
    }
    maven { url = uri("https://repo.codemc.io/repository/maven-releases/") }
    maven { url = uri("https://repo.codemc.io/repository/maven-snapshots/") }
    maven {
        url "https://repo.viaversion.com/everything"
    }
    mavenCentral()
}

dependencies {
    compileOnly ':mspigot'
//    compileOnly ':ProtocolLib'
    implementation(project(":bot-api"))
    implementation(project(":bot-shared-library"))
    implementation(project(":bot-base-client"))
    implementation(project(":bot-intelligence"))
}
java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

shadowJar {
    relocate('net.minecraft', 'gg.mineral.minecraft') {
        exclude 'net.minecraft.server.v1_8_R3.**'
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    configurations = [project.configurations.runtimeClasspath]
}

jar {
    enabled = false
}

tasks.build.dependsOn tasks.shadowJar
